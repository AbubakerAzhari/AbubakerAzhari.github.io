    <script>
(function () {
  const root = document.documentElement;
  document.getElementById('themeToggle').addEventListener('click', () => {
    const next = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('theme', next); } catch (e) {}
  });

  const el = document.getElementById('typed');
  const roles = [
    'مطور تطبيقات سطح المكتب',
    'مطور تطبيقات اندرويد',
    'محلل بيانات',
    'مصمم ثلاثي الابعاد',
    'محاسب',
    'متعدد المهام',
    'مهارات تنظيمية',
    'حل المشكلات'
  ];

  let roleIndex = 0, charIndex = 0, deleting = false;
  const TYPE_SPEED = 65, DELETE_SPEED = 32, HOLD_TIME = 1500;
  function tick() {
    const current = roles[roleIndex];
    if (!deleting) {
      el.textContent = current.slice(0, ++charIndex);
      if (charIndex === current.length) { deleting = true; return setTimeout(tick, HOLD_TIME); }
      return setTimeout(tick, TYPE_SPEED);
    }
    el.textContent = current.slice(0, --charIndex);
    if (charIndex === 0) { deleting = false; roleIndex = (roleIndex + 1) % roles.length; return setTimeout(tick, 320); }
    setTimeout(tick, DELETE_SPEED);
  }
  if (el) setTimeout(tick, 500);
})();

(function () {
  const nav = document.getElementById('nav');
  const navLinks = document.getElementById('navLinks');
  const navToggle = document.getElementById('navToggle');
  const links = navLinks.querySelectorAll('a');
  const onScroll = () => nav.classList.toggle('scrolled', window.scrollY > 20);
  window.addEventListener('scroll', onScroll, { passive: true });
  onScroll();
  navToggle.addEventListener('click', () => {
    const open = navLinks.classList.toggle('open');
    navToggle.setAttribute('aria-expanded', String(open));
  });
  links.forEach(l => l.addEventListener('click', () => {
    navLinks.classList.remove('open');
    navToggle.setAttribute('aria-expanded', 'false');
  }));
  const sections = document.querySelectorAll('main section[id]');
  const setActive = id => links.forEach(l => l.classList.toggle('active', l.getAttribute('href') === '#' + id));
  new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
  }, { rootMargin: '-45% 0px -50% 0px' }).observe || sections.forEach(s => {});
  const obs = new IntersectionObserver(entries => {
    entries.forEach(e => { if (e.isIntersecting) setActive(e.target.id); });
  }, { rootMargin: '-45% 0px -50% 0px' });
  sections.forEach(s => obs.observe(s));
})();

(function () {
  const bar = document.getElementById('progressBar');
  const toTop = document.getElementById('toTop');
  function update() {
    const st = window.scrollY;
    const h = document.documentElement.scrollHeight - window.innerHeight;
    bar.style.width = (h > 0 ? (st / h) * 100 : 0) + '%';
    toTop.classList.toggle('show', st > 500);
  }
  window.addEventListener('scroll', update, { passive: true });
  window.addEventListener('resize', update);
  update();
  toTop.addEventListener('click', () => window.scrollTo({ top: 0, behavior: 'smooth' }));
})();

(function () {
  const items = document.querySelectorAll('.reveal');
  if (!('IntersectionObserver' in window)) { items.forEach(el => el.classList.add('visible')); return; }
  const obs = new IntersectionObserver((entries, o) => {
    entries.forEach((e, i) => {
      if (!e.isIntersecting) return;
      setTimeout(() => e.target.classList.add('visible'), i * 70);
      o.unobserve(e.target);
    });
  }, { threshold: 0.12, rootMargin: '0px 0px -60px 0px' });
  items.forEach(el => obs.observe(el));
})();

(function () {
  const counters = document.querySelectorAll('.stat-num');
  const animate = el => {
    const target = parseInt(el.dataset.count, 10);
    const duration = 1400;
    const start = performance.now();
    function step(now) {
      const p = Math.min((now - start) / duration, 1);
      const eased = p === 1 ? 1 : 1 - Math.pow(2, -10 * p);
      el.textContent = Math.floor(eased * target).toLocaleString('en-US');
      if (p < 1) requestAnimationFrame(step);
      else el.textContent = target.toLocaleString('en-US') + (target >= 1000 ? '+' : '');
    }
    requestAnimationFrame(step);
  };
  const obs = new IntersectionObserver((entries, o) => {
    entries.forEach(e => { if (e.isIntersecting) { animate(e.target); o.unobserve(e.target); } });
  }, { threshold: 0.5 });
  counters.forEach(c => obs.observe(c));
})();

(function () {
  const buttons = document.querySelectorAll('.filter-btn');
  const cards = document.querySelectorAll('.project-card');
  buttons.forEach(btn => {
    btn.addEventListener('click', () => {
      buttons.forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      const filter = btn.dataset.filter;
      cards.forEach((card, i) => {
        const match = filter === 'all' || card.dataset.category.split(' ').includes(filter);
        card.classList.toggle('hide', !match);
        if (match) {
          card.style.animation = 'none';
          void card.offsetWidth;
          card.style.animation = `cardIn .5s var(--ease) ${i * 45}ms backwards`;
        }
      });
    });
  });
})();

(function () {
  const form = document.getElementById('contactForm');
  if (!form) return;
  const EMAIL = 'hello@example.com';
  form.addEventListener('submit', e => {
    e.preventDefault();
    const name = form.name.value.trim();
    const email = form.email.value.trim();
    const message = form.message.value.trim();
    if (!name || !email || !message) { alert('يرجى ملء جميع الحقول.'); return; }
    const subject = encodeURIComponent(`رسالة من ${name}`);
    const body = encodeURIComponent(`الاسم: ${name}\nالبريد: ${email}\n\n${message}`);
    window.location.href = `mailto:${EMAIL}?subject=${subject}&body=${body}`;
    form.reset();
  });
})();

document.getElementById('year').textContent = new Date().getFullYear();

document.querySelectorAll('a[href^="#"]').forEach(anchor => {
  anchor.addEventListener('click', function (e) {
    const id = this.getAttribute('href');
    if (id === '#' || id.length < 2) return;
    const target = document.querySelector(id);
    if (!target) return;
    e.preventDefault();
    const top = target.getBoundingClientRect().top + window.scrollY - 84;
    window.scrollTo({ top, behavior: 'smooth' });
  });
});
